<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; font-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'"
    />
    <title>Bets Tracker</title>
    <meta name="description" content="Las apuestas, la Sombra y Grok del Bets Tracker, solo lectura." />
    <meta name="theme-color" content="#eceff1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1318" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bets" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <link rel="modulepreload" href="vendor/preact.js" />
    <link rel="stylesheet" href="src/styles/tokens.css" />
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
    <!-- One stylesheet per feature; a feature may @import more files from its own folder. -->
    <link rel="stylesheet" href="src/features/overview/overview.css" />
    <link rel="stylesheet" href="src/features/explorer/explorer.css" />
    <link rel="stylesheet" href="src/features/simulator/simulator.css" />
    <link rel="stylesheet" href="src/features/tests/tests.css" />
    <link rel="stylesheet" href="src/features/analysis/analysis.css" />
    <link rel="stylesheet" href="src/features/decisions/decisions.css" />
    <link rel="stylesheet" href="src/features/glossary/glossary.css" />
    <link rel="stylesheet" href="src/features/settings/settings.css" />
    <!-- Applies the saved theme before first paint (after the stylesheets on purpose). -->
    <script src="src/lib/theme-boot.js"></script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="boot" id="boot-splash">
        <div><img src="assets/icons/icon-192.png" alt="" width="72" height="72" /></div>
      </div>
      <div class="boot" id="boot-error" hidden>
        <div>
          <img src="assets/icons/icon-192.png" alt="" width="72" height="72" />
          <p lang="es">No se pudo abrir la app. Revisa tu conexión y vuelve a intentarlo.</p>
          <p lang="en">The app could not start. Check your connection and try again.</p>
        </div>
      </div>
    </div>
    <noscript>Bets Tracker necesita JavaScript. / Bets Tracker needs JavaScript.</noscript>
  </body>
</html>
